<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="shortcut icon" type="image/x-icon" href="https://d1efvhlbiqueiq.cloudfront.net/favicon.png">
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>OLOY</title>
</head>
<body>
    <div id="overlay">
        <div class="input-container">
            <div class="title">input code below</div>
            <div class="input">
                <input type="text" placeholder="yolo code" maxlength="10">
            </div>
        </div>
    </div>
    <div id="header">
        <div id="title">OLOY</div>
    </div>
    <div id="body" class="default">
        <div id="username"></div>
        <div id="noaccess" class="default-text">input account code</div>
        <div id="load" class="default-text">loading user data</div>
        <div id="button">access account</div>
        <div id="loading">
            <div class="box">
                <div class="plane"></div>
            </div>
        </div>
        <div id="messages"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
